<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온보딩 · A 만난 모시가 남는 모시</title>
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/tokens.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/base.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/glass.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/three/Wallpaper.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/Button.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/Chip.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/TextField.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/Sheet.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/screens/chat/onboarding/onboarding.css">
<link rel="stylesheet" href="../_kit/kit.css">
<link rel="stylesheet" href="draft.css">
<style>
  /* one file, five resting states: 01 hero (A.html), 02 step 1, 03 step 2, 04 login, 04b reset (A-<state>.html) */
  .d-sheet {
    display: none;
  }
  :root[data-state="step1"] .d-sheet[data-for="step1"],
  :root[data-state="step2"] .d-sheet[data-for="step2"],
  :root[data-state="login"] .d-sheet[data-for="login"] {
    display: block;
  }
  .onb-blob {
    display: grid;
    place-items: center;
  }
  .btn-lg {
    height: 52px;
    min-width: 52px;
    border-radius: var(--r-capsule);
  }

  /* P2 one frame: both sign-up steps (and login) share one sheet height, so the panel top always lands above the
     headline (never slicing it) and only the content swaps between steps (ContentSwap) */
  .sheet-panel {
    --r: var(--r-sheet);
  }
  .d-sheet[data-for^="step"] .sheet-panel {
    height: 404px;
  }
  .d-sheet[data-for="login"] .sheet-panel {
    height: 436px;
  }
  .sheet-body {
    display: flex;
    flex-direction: column;
  }
  /* P2 back: the sheet header's empty leading slot holds "이전 단계", built like the close plate */
  .d-sheet-back {
    grid-column: 1;
    grid-row: 1;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: var(--r-control);
    color: var(--label-2);
  }
  .sheet-title,
  .sheet-close {
    grid-row: 1;
  }
  /* P2 face: the name is typed next to the face it belongs to (the same spec the chat will show) */
  .d-tf-lead {
    flex: none;
    display: grid;
    margin: 0 10px 0 -2px;
  }
  /* P1 recovery: plain text actions, the .onb-back / .onb-login treatments */
  .d-text-action {
    align-self: flex-start;
    min-height: 44px;
    padding: 0 8px 0 4px;
    font-size: var(--t-subhead);
    color: var(--label-2);
    border-radius: var(--r-control);
  }
  .d-sheet-foot-link {
    display: block;
    width: 100%;
    margin-top: 4px;
  }

  /* P1 recovery (state "reset"): a phone-verified reset; the no-phone case is said plainly, with its one way out */
  :root[data-state="reset"] .d-sheet[data-for="reset"] {
    display: block;
  }
  .d-sheet[data-for="reset"] .sheet-panel {
    height: 436px;
  }
  .d-reset-lead {
    padding: 0 4px;
    font-size: var(--t-subhead);
    line-height: 1.55;
    color: var(--label);
    text-wrap: pretty;
  }
  .d-reset-none {
    padding: 0 4px;
    font-size: var(--t-footnote);
    line-height: 1.5;
    color: var(--label-2);
    text-wrap: pretty;
  }
</style>
</head>
<body>
<div class="kit-phone">
  <section class="onb" aria-label="모시 시작하기">
    <div class="onb-hero">
      <div class="onb-blob" aria-hidden="true"><i data-agent data-size="208" data-eyes="dot"></i></div>
      <h1 class="onb-title">나만의 모시를 만나보세요</h1>
      <p class="onb-sub">말로 맡기면 알아서 찾아보고, 정리하고, 대신 해 드려요.</p>
    </div>
    <div class="onb-actions">
      <button type="button" class="btn btn-full btn-lg" data-tone="primary" data-size="lg"><span class="btn-label">시작하기</span></button>
      <button type="button" class="onb-login">이미 계정이 있어요 · <span class="onb-login-em">로그인</span></button>
    </div>
  </section>

  <!-- 02 · step 1 -->
  <div class="sheet-root d-sheet" data-for="step1">
    <div class="sheet-scrim"></div>
    <div class="sheet-panel glass" data-sheet role="dialog" aria-label="모시 만들기">
      <div class="sheet-head">
        <div class="sheet-grabber"></div>
        <h2 class="sheet-title"><span class="onb-sheet-title">모시 만들기 <span class="onb-step tnum">1/2</span></span></h2>
        <button type="button" class="sheet-close" aria-label="닫기"><span class="sheet-close-plate"><i data-glyph="close" data-size="16" data-weight="semibold"></i></span></button>
      </div>
      <div class="sheet-body">
        <form class="onb-form">
          <div class="tf tf--plain">
            <label class="tf-label">아이디</label>
            <div class="tf-box"><input class="tf-input" autocomplete="username" aria-describedby="h1"></div>
            <p class="tf-hint" id="h1">영문 소문자와 숫자로 3~20자예요. 밑줄(_)도 쓸 수 있어요</p>
          </div>
          <div class="tf tf--plain">
            <label class="tf-label">비밀번호</label>
            <div class="tf-box"><input class="tf-input" type="password" autocomplete="new-password"><button type="button" class="tf-btn tf-eye" aria-label="비밀번호 보기"><i data-glyph="eye" data-size="22"></i></button></div>
            <p class="tf-hint">8자 이상</p>
          </div>
        </form>
      </div>
      <div class="sheet-footer"><button type="button" class="btn btn-full btn-lg" data-tone="primary" data-size="lg"><span class="btn-label">다음</span></button></div>
    </div>
  </div>

  <!-- 03 · step 2 -->
  <div class="sheet-root d-sheet" data-for="step2">
    <div class="sheet-scrim"></div>
    <div class="sheet-panel glass" data-sheet role="dialog" aria-label="모시 만들기">
      <div class="sheet-head">
        <div class="sheet-grabber"></div>
        <button type="button" class="d-sheet-back" aria-label="이전 단계"><span class="sheet-close-plate"><i data-glyph="chevron-left" data-size="16" data-weight="semibold"></i></span></button>
        <h2 class="sheet-title"><span class="onb-sheet-title">모시 만들기 <span class="onb-step tnum">2/2</span></span></h2>
        <button type="button" class="sheet-close" aria-label="닫기"><span class="sheet-close-plate"><i data-glyph="close" data-size="16" data-weight="semibold"></i></span></button>
      </div>
      <div class="sheet-body">
        <form class="onb-form">
          <div class="tf tf--plain">
            <label class="tf-label">내 이름</label>
            <div class="tf-box"><input class="tf-input" autocomplete="name"></div>
            <p class="tf-hint">모시가 부를 이름이에요</p>
          </div>
          <div class="tf tf--plain">
            <label class="tf-label">모시 이름</label>
            <div class="tf-box"><span class="d-tf-lead"><i data-agent data-size="30" data-eyes="dot"></i></span><input class="tf-input" value="깽이"></div>
          </div>
          <div class="onb-names" role="group" aria-label="추천 이름">
            <button type="button" class="chip chip--sm is-selected">깽이</button>
            <button type="button" class="chip chip--sm">콩이</button>
            <button type="button" class="chip chip--sm">몽이</button>
            <button type="button" class="chip chip--sm">두부</button>
          </div>
        </form>
      </div>
      <div class="sheet-footer"><button type="button" class="btn btn-full btn-lg" data-tone="primary" data-size="lg"><span class="btn-label">모시 만들기</span></button></div>
    </div>
  </div>

  <!-- 04 · login -->
  <div class="sheet-root d-sheet" data-for="login">
    <div class="sheet-scrim"></div>
    <div class="sheet-panel glass" data-sheet role="dialog" aria-label="로그인">
      <div class="sheet-head">
        <div class="sheet-grabber"></div>
        <h2 class="sheet-title">로그인</h2>
        <button type="button" class="sheet-close" aria-label="닫기"><span class="sheet-close-plate"><i data-glyph="close" data-size="16" data-weight="semibold"></i></span></button>
      </div>
      <div class="sheet-body">
        <form class="onb-form">
          <div class="tf tf--plain">
            <label class="tf-label">아이디</label>
            <div class="tf-box"><input class="tf-input" autocomplete="username"></div>
          </div>
          <div class="tf tf--plain">
            <label class="tf-label">비밀번호</label>
            <div class="tf-box"><input class="tf-input" type="password" autocomplete="current-password"><button type="button" class="tf-btn tf-eye" aria-label="비밀번호 보기"><i data-glyph="eye" data-size="22"></i></button></div>
          </div>
          <button type="button" class="d-text-action">비밀번호를 잊었어요</button>
        </form>
      </div>
      <div class="sheet-footer">
        <button type="button" class="btn btn-full btn-lg" data-tone="primary" data-size="lg"><span class="btn-label">로그인</span></button>
        <button type="button" class="onb-login d-sheet-foot-link">처음이에요 · <span class="onb-login-em">시작하기</span></button>
      </div>
    </div>
  </div>

  <!-- 04b · password reset (from "비밀번호를 잊었어요"): phone-verified reset; needs server work -->
  <div class="sheet-root d-sheet" data-for="reset">
    <div class="sheet-scrim"></div>
    <div class="sheet-panel glass" data-sheet role="dialog" aria-label="비밀번호 다시 만들기">
      <div class="sheet-head">
        <div class="sheet-grabber"></div>
        <button type="button" class="d-sheet-back" aria-label="로그인으로"><span class="sheet-close-plate"><i data-glyph="chevron-left" data-size="16" data-weight="semibold"></i></span></button>
        <h2 class="sheet-title">비밀번호 다시 만들기</h2>
        <button type="button" class="sheet-close" aria-label="닫기"><span class="sheet-close-plate"><i data-glyph="close" data-size="16" data-weight="semibold"></i></span></button>
      </div>
      <div class="sheet-body">
        <form class="onb-form">
          <p class="d-reset-lead">앱에서 인증해 둔 전화번호로 문자 코드를 보내 드려요. 코드를 확인하면 새 비밀번호를 만들 수 있어요.</p>
          <div class="tf tf--plain">
            <label class="tf-label">아이디</label>
            <div class="tf-box"><input class="tf-input" autocomplete="username" value="jieun_kim"></div>
          </div>
          <p class="d-reset-none">전화번호를 인증하지 않았다면 비밀번호를 다시 만들 수 없어요. 새 아이디로 시작하면 새 모시를 만나요.</p>
        </form>
      </div>
      <div class="sheet-footer">
        <button type="button" class="btn btn-full btn-lg" data-tone="primary" data-size="lg"><span class="btn-label">문자 코드 받기</span></button>
        <button type="button" class="onb-login d-sheet-foot-link">새 아이디로 · <span class="onb-login-em">시작하기</span></button>
      </div>
    </div>
  </div>
</div>
<script type="application/json" id="kit-meta">{
  "feature": "onboarding",
  "variant": "A",
  "title": "만난 모시가 남는 모시",
  "rationale": [
    "첫 화면의 캐릭터가 가입 뒤 채팅의 그 캐릭터: 같은 색(hue) · 같은 눈(dot), 기본 빨강(hue 8) 대역 없음",
    "가입 1·2단계와 로그인이 같은 시트 높이: 제목을 자르지 않고 내용만 바뀜",
    "2단계 '이전 단계'는 시트 머리 왼쪽 빈칸으로, 모시 이름 칸 앞에 그 얼굴",
    "로그인에 '비밀번호를 잊었어요'와 '처음이에요 · 시작하기'",
    "아이디 힌트를 말로: '영문 소문자와 숫자로 3~20자예요. 밑줄(_)도 쓸 수 있어요'"
  ],
  "motion": [
    "시작하기 → 시트 morph (§6.1)",
    "단계 사이 content swap (§3)",

    "캐릭터 호흡 3.2 s ≤2 % (§8.11)",

  "fixes": [

<script src="glyphs.js"></script>

<script src="../_kit/kit.js"></script>
</body>
</html>
