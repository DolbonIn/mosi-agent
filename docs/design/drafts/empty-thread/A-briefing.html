<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모시 draft: 빈 대화와 제안 · A 하나 고른 뒤</title>
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/tokens.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/base.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/glass.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/three/Wallpaper.css">
<link rel="stylesheet" href="../_kit/kit.css">
<link rel="stylesheet" href="draft.css">
</head>
<body>
<div class="kit-phone">
  <main class="k-screen has-composer">
    <div class="a-thread">
      <div class="a-bubble">안녕하세요, 하늘 님. 저는 깽이예요.<br>궁금한 걸 묻거나 귀찮은 일을 맡겨 주세요.</div>
      <section class="k-group" aria-labelledby="brief-t">
        <h2 class="a-brief-title" id="brief-t">이런 일을 맡겨 보세요</h2>
        <div class="d-stagger">
          <button class="k-row d-press d-sent" aria-disabled="true" aria-describedby="sent-note" style="--i:0"><i data-icon="sun" data-size="20" class="d-glyph"></i><span class="k-row-main">오늘 날씨와 미세먼지를 알려 드려요</span></button>
          <button class="k-row d-press" style="--i:1"><i data-icon="doc" data-size="20" class="d-glyph"></i><span class="k-row-main">지금 신청할 수 있는 정부 지원사업을 찾아 드려요</span></button>
          <button class="k-row d-press" style="--i:2"><i data-icon="kakao" data-size="20" class="d-glyph"></i><span class="k-row-main">카카오톡을 연결하면 안 읽은 대화를 정리해 드려요</span><span class="k-row-trail"><i data-icon="chevron-right" data-size="16" data-weight="medium"></i></span></button>
          <button class="k-row d-press" style="--i:3"><i data-icon="clock" data-size="20" class="d-glyph"></i><span class="k-row-main">매일 아침 브리핑을 먼저 보내 드려요</span></button>
        </div>
      </section>
      <div class="d-me">오늘 날씨 알려 줘</div>
      <div class="a-wait" aria-busy="true"><span class="d-wait">생각하는 중<span class="tnum"> · 2초</span></span></div>
      <span id="sent-note" hidden>답을 받는 중이에요</span>
    </div>
  </main>

  <!-- function layer: 3 glass shapes (menu circle, composer, tab bar); the name is text on the edge, 초대 moved out -->
  <header class="k-topbar">
    <button class="glass k-circle" data-text aria-label="메뉴"><i data-icon="menu" data-weight="medium"></i></button>
    <div class="k-title"><i data-avatar data-size="30"></i>깽이</div>
  </header>
  <div class="k-bottom">
    <div class="glass k-composer" data-text>
      <span class="k-composer-icon"><i data-icon="plus"></i></span>
      <span class="k-composer-field">메시지 보내기</span>
      <span class="k-composer-icon" aria-label="멈추기"><span class="d-stop" aria-hidden="true"></span></span>
      <span class="k-composer-icon"><i data-icon="phone"></i></span>
    </div>
    <nav class="glass k-tabbar" data-text aria-label="탭">
      <span class="k-tab" data-on><i data-icon="chat" data-size="24"></i>채팅</span>
      <span class="k-tab"><i data-icon="compass" data-size="24"></i>둘러보기</span>
      <span class="k-tab"><i data-icon="archive" data-size="24"></i>보관함</span>
      <span class="k-tab"><i data-icon="person" data-size="24"></i>나의 모시</span>
    </nav>
  </div>
</div>
<script type="application/json" id="kit-meta">
{
  "feature": "빈 대화와 제안",
  "variant": "A · 하나 고른 뒤",
  "title": "첫 할 일을 고른 바로 다음",
  "rationale": [
    "날씨 줄을 누르면 '오늘 날씨 알려 줘'가 내 말로 올라가고, 깽이가 답을 준비해요. 지금처럼 바로 보내요.",
    "다른 세 줄은 그대로 누를 수 있어요. 날씨를 물어도 지원사업 찾기가 막히지 않아요 (critique P2-2). 답을 준비하는 동안 다른 줄을 누르면 지금 하던 일에 이어서 전달돼요.",
    "고른 줄만 답이 올 때까지 label-2로 낮춰서 두 번 보내지 않게 해요. 회색 비활성은 쓰지 않고, 답이 오면 다시 누를 수 있어요.",
    "컴포저의 마이크 자리는 일하는 동안 멈추기 버튼이 돼요. 앱의 SendButton과 같아요.",
    "칩 네 개는 없고 줄이 곧 버튼이에요. 같은 일이 두 번 보이지 않아요 (CH-1, IT-1)."
  ],
  "motion": [
    "누른 줄은 press 스프링으로 반응하고, 내 말풍선은 지금처럼 같은 프레임에 나타나요",
    "'생각하는 중'은 1초가 지나면 나타나고, 상태가 바뀌면 ContentSwap으로 바뀌어요",
    "마이크와 멈추기는 SendButton의 morph로 바뀌어요 (§8.4)",
    "새 줄이 생겨도 목록이 다시 나타나는 애니메이션은 없어요"
  ],
  "fixes": ["P1-2", "P2-2", "slop:CH-1", "slop:IT-1", "slop:GL-1"],
  "compare": [
    "chromium-light-06-chat-welcome-briefing.jpg"
  ]
}
</script>
<script src="../_kit/kit.js"></script>
</body>
</html>
