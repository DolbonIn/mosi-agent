<body>
<div class="kit-phone">
  <main class="k-screen has-composer">
    <div class="a-thread">
      <div class="a-bubble">안녕하세요, 하늘 님. 저는 깽이예요.<br>궁금한 걸 묻거나 귀찮은 일을 맡겨 주세요.</div>
      <section class="k-group" aria-labelledby="brief-t">
        <h2 class="a-brief-title" id="brief-t">이런 일을 맡겨 보세요</h2>
        <div class="d-stagger">
          <button class="k-row d-press" style="--i:0"><i data-icon="sun" data-size="20" class="d-glyph"></i><span class="k-row-main">오늘 날씨와 미세먼지를 알려 드려요</span></button>
          <button class="k-row d-press" style="--i:1"><i data-icon="doc" data-size="20" class="d-glyph"></i><span class="k-row-main">지금 신청할 수 있는 정부 지원사업을 찾아 드려요</span></button>
          <button class="k-row d-press" style="--i:2"><i data-icon="kakao" data-size="20" class="d-glyph"></i><span class="k-row-main">카카오톡을 연결하면 안 읽은 대화를 정리해 드려요</span><span class="k-row-trail"><i data-icon="chevron-right" data-size="16" data-weight="medium"></i></span></button>
          <button class="k-row d-press" style="--i:3"><i data-icon="clock" data-size="20" class="d-glyph"></i><span class="k-row-main">매일 아침 브리핑을 먼저 보내 드려요</span></button>
        </div>
      </section>
    </div>
  </main>

  <!-- function layer: 3 glass shapes (menu circle, composer, tab bar); the name is text on the edge, 초대 moved out -->
  <header class="k-topbar">
    <button class="glass k-circle" data-text aria-label="메뉴"><i data-icon="menu" data-weight="medium"></i></button>
    <div class="k-title"><i data-avatar data-size="30"></i>깽이</div>
  </header>
  <div class="k-bottom">
    <div class="glass k-composer" data-text>
      <span class="k-composer-icon"><i data-icon="plus"></i></span>
      <span class="k-composer-field">메시지 보내기</span>
      <span class="k-composer-icon"><i data-icon="mic"></i></span>
      <span class="k-composer-icon"><i data-icon="phone"></i></span>
    </div>
    <nav class="glass k-tabbar" data-text aria-label="탭">
      <span class="k-tab" data-on><i data-icon="chat" data-size="24"></i>채팅</span>
      <span class="k-tab"><i data-icon="compass" data-size="24"></i>둘러보기</span>
      <span class="k-tab"><i data-icon="archive" data-size="24"></i>보관함</span>
      <span class="k-tab"><i data-icon="person" data-size="24"></i>나의 모시</span>
    </nav>
  </div>
</div>
