<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>둘러보기 · A 같은 화면, 색과 숫자를 뺀</title>
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/tokens.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/base.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/styles/glass.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/three/Wallpaper.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/LargeTitle.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/Button.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/ui/Sheet.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/screens/more/more.css">
<link rel="stylesheet" href="../../../../apps/mobile/src/screens/more/explore/explore.css">
<link rel="stylesheet" href="../_kit/kit.css">
<link rel="stylesheet" href="draft.css">
<style>
/* ── shared by A and B ── */
  /* Flat Paper: the template group separates from the wallpaper by value; dark keeps the List.css hairline */
  .tpl-list {
    box-shadow: none;
  }
  :root[data-theme="dark"] .tpl-list,
  :root[data-contrast="more"] .tpl-list {
    box-shadow: inset 0 0 0 1px var(--separator);
  }
  /* P2 wall: two lines of description are enough; the sheet restates the rest */
  .tpl-desc {
    -webkit-line-clamp: 2;
  }
  .tpl-row {
    align-items: center;
  }
  .tpl-count {
    margin-top: 2px;
  }
  /* sheet state: the screen stays at rest under a modal sheet (scrim), one file per resting state */
  .d-sheet {
    display: none;
  }
  :root[data-state="sheet"] .d-sheet {
    display: block;
  }
  .sheet-panel {
    --r: var(--r-sheet);
  }
  .pre-body {
    gap: 22px;
  }
  /* P2 sheet: steps are plain numbered lines on the sheet (the unused .pre-step-no style), no tile, no panel */
  .d-steps {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 4px;
  }
  .d-steps li {
    display: flex;
    gap: 10px;
    font-size: var(--t-subhead);
    line-height: 1.5;
  }
  .d-steps .pre-step-no {
    text-align: left;
    line-height: 1.5;
    font-size: var(--t-subhead);
  }
  .d-step-title {
    font-weight: 500;
    color: var(--label);
  }
  .d-step-sub {
    display: block;
    font-size: var(--t-footnote);
    color: var(--label-2);
  }
  /* P1 call-demo: the missing prerequisite is a row on the sheet itself, with a hairline, never a recessed panel */
  .d-need {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 8px 4px;
    box-shadow: inset 0 -1px 0 var(--separator), inset 0 1px 0 var(--separator);
  }
  .d-need > [data-glyph] {
    flex: none;
    color: var(--label-2);
  }
  .d-need-main {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .d-need-title {
    font-size: var(--t-subhead);
    font-weight: 500;
    line-height: 1.4;
  }
  .d-need-sub {
    font-size: var(--t-footnote);
    line-height: 1.4;
    color: var(--label-2);
  }
  .btn-sm {
    flex: none;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--r-capsule);
  }
  .btn-lg {
    height: 52px;
    border-radius: var(--r-capsule);
  }
  /* NC-6: the two hero-metric tiles become one meta line */
  .d-facts {
    font-size: var(--t-footnote);
    line-height: 1.4;
    color: var(--label-2);
    padding: 0 4px;
  }
  .more-note {
    padding: 0 4px;
  }

  /* ── A: the same screen, the residue taken off ── */
  /* IT-12 / SH-2: neutral plates, one --label glyph, no shadow, no hue map; 64 px items so a sixth plate peeks */
  .cat-item {
    width: 64px;
  }
  .cat-glyph,
  :root[data-theme="dark"] .cat-glyph {
    color: var(--label);
    background: var(--fill);
    box-shadow: none;
  }
  .cat-label {
    opacity: 1;
    color: var(--label-2);
  }
  .cat-item[data-on] .cat-label {
    color: var(--label);
  }
  .cat-droplet {
    box-shadow: none;
    width: 60px;
    border-radius: 30px;
    transform: translateX(calc(var(--gutter) + 2px));
  }
  /* IT-11: no hue plate; the template's glyph stays as a bare 22 px label-2 mark in a 24 px column */
  .d-tpl-glyph {
    flex: none;
    align-self: flex-start;
    display: grid;
    place-items: center;
    width: 24px;
    height: 22px;
    margin-top: 1px;
    color: var(--label-2);
  }
  .tpl-list > li + li .tpl-row::before {
    left: 52px;
  }
</style>
</head>
<body>
<div class="kit-phone">
  <main class="d-scroll">
    <header class="large-title">
      <div class="large-title-row"><h1 class="large-title-text">둘러보기</h1></div>
    </header>
    <div class="d-stack">
      <div class="cat-rail" data-fade-r>
        <div class="cat-scroll" role="tablist" aria-label="카테고리">
          <div class="cat-track">
          <span class="cat-droplet" aria-hidden="true"></span>
          <button type="button" class="cat-item" role="tab" data-on aria-selected="true"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="star" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">추천</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="coins" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">혜택</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="bag" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">쇼핑</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="plane" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">여행</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="people" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">사람</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="film" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">문화</span></button>
          <button type="button" class="cat-item" role="tab" aria-selected="false"><span class="cat-plate"><span class="cat-glyph" aria-hidden="true"><i data-glyph="house" data-size="28" data-weight="medium"></i></span></span><span class="cat-label">집·생활</span></button>
          </div>
        </div>
      </div>
      <section aria-labelledby="ex-suggest">
        <h2 class="explore-h" id="ex-suggest">깽이의 제안</h2>
      <ul class="tpl-list" aria-label="깽이의 제안">
        <li><button type="button" class="tpl-row" data-tpl="morning-briefing"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="sun" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">매일 아침 7시 모닝 브리핑 보내 드릴게요</span><span class="tpl-desc">날씨·미세먼지·주요 뉴스·오늘 일정을 매일 아침 7시에 한 번에 정리해 먼저 보내 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="connect-kakao"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="chat" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">카카오톡을 연결하면 놓친 대화를 대신 정리해 드릴게요</span><span class="tpl-desc">카카오톡을 연결해 두면 깽이에게 안 읽은 대화 요약이나 답장을 맡길 수 있어요.</span><span class="tpl-count"><i data-glyph="link" data-size="15" data-weight="medium"></i>연결하면 바로 쓸 수 있어요</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="suggest-wakeup"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="clock" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">일어나야 하는 시간에 맞춰 지은님께 모닝콜 브리핑을 보내 드릴게요</span><span class="tpl-desc">매일 일어날 시간에 먼저 말을 걸어 날씨와 오늘 할 일을 챙겨 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
      </ul>
      </section>
      <section aria-labelledby="ex-all">
        <h2 class="explore-h" id="ex-all">맡길 수 있는 일</h2>
      <ul class="tpl-list" aria-label="맡길 수 있는 일">
        <li><button type="button" class="tpl-row" data-tpl="call-demo"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="phone" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">제 전화, 먼저 한번 받아 보실래요?</span><span class="tpl-desc">지금 바로 전화를 걸어요. 다른 사람에게 걸 때 어떻게 들리는지 직접 들어 보세요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="gov-benefits"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="coins" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">내가 받을 수 있는 정부 지원사업을 찾아 드릴게요</span><span class="tpl-desc">K-Startup·기업마당 등 지금 신청할 수 있는 지원사업과 청년·주거 공고(LH)를 내 조건에 맞춰 마감 순으로 정리해요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="news-briefing"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="doc" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">오늘 주요 뉴스 브리핑해 드릴게요</span><span class="tpl-desc">오늘 꼭 알아야 할 뉴스를 분야별로 골라 세 줄씩 요약해 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="stock-watch"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="chart" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">관심 종목 기본 정보와 소식 정리해 드릴게요</span><span class="tpl-desc">관심 있는 종목의 기본 정보와 최근 뉴스를 한눈에 정리해 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="outlet-trip"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="bag" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">주말에 갈 만한 아울렛, 가는 길까지 찾아 드릴게요</span><span class="tpl-desc">출발지에서 가까운 아울렛·대형마트를 찾고 차로 얼마나 걸리는지 알려 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="jeju-trip"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="plane" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">제주 2박 3일 일정 문서로 만들어 드릴게요</span><span class="tpl-desc">날씨와 가볼 만한 곳을 확인해 동선에 맞춘 2박 3일 일정을 문서로 정리해 보관함에 넣어 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="holiday-plan"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="calendar" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">올해 공휴일로 연차 계획 짜 드릴게요</span><span class="tpl-desc">남은 공휴일을 확인해 연차를 가장 적게 쓰고 가장 길게 쉴 수 있는 날을 찾아 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="travel-safety"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="shield" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">해외여행 안전 정보 확인해 드릴게요</span><span class="tpl-desc">외교부 여행경보와 안전 공지로 가려는 나라의 안전 정보를 정리해 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="kakao-unread"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="chat" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">카카오톡 안 읽은 대화 요약해 드릴게요</span><span class="tpl-desc">연결된 카카오톡에서 안 읽은 대화를 모아 누가 무슨 말을 했는지, 답장이 필요한 것만 골라 정리해요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="slack-digest"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="chat" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">슬랙 채널 요약해 드릴게요</span><span class="tpl-desc">연결된 슬랙에서 오늘 오간 대화를 채널별로 요약하고, 나를 찾는 메시지를 먼저 보여 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="friend-relay"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="people" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">친구의 모시에게 말 전해 드릴게요</span><span class="tpl-desc">모시 친구에게 약속이나 부탁을 정중하게 대신 전해 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="weekend-shows"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="film" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">이번 주말 서울 공연 찾아 드릴게요</span><span class="tpl-desc">공연예술통합전산망(KOPIS)에서 이번 주말 서울에서 볼 수 있는 연극·뮤지컬·콘서트를 찾아 정리해요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="library-books"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="doc" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">읽고 싶은 책, 동네 도서관에서 찾아 드릴게요</span><span class="tpl-desc">읽고 싶은 책이 가까운 공공도서관에 있는지, 지금 빌릴 수 있는지 찾아 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="han-river"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="wave" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">오늘 한강 산책하기 좋은지 알려 드릴게요</span><span class="tpl-desc">한강 정보와 날씨·미세먼지를 확인하고, 따릉이 대여소 현황까지 챙겨 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="subway-commute"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="train" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">퇴근길 지하철 도착 알려 드릴게요</span><span class="tpl-desc">타는 역과 방향만 알려 주시면 실시간 도착 정보로 다음 열차 시간을 알려 드려요. 매일 퇴근 시간에 맞춰 알려 드릴 수도 있어요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="airport-drive"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="map" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">공항까지 차로 얼마나 걸리는지 알려 드릴게요</span><span class="tpl-desc">출발지에서 공항까지 자동차(택시) 기준 이동 시간과 거리를 알려 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="fine-dust"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="cloud" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">미세먼지 보고 외출해도 될지 알려 드릴게요</span><span class="tpl-desc">지금 동네 미세먼지와 날씨를 확인해 마스크가 필요한지, 외출하기 좋은 시간을 알려 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
        <li><button type="button" class="tpl-row" data-tpl="apt-prices"><span class="d-tpl-glyph" aria-hidden="true"><i data-glyph="house" data-size="22"></i></span><span class="tpl-main"><span class="tpl-title">우리 동네 아파트 실거래가 알려 드릴게요</span><span class="tpl-desc">국토교통부 실거래가로 우리 동네 아파트가 최근 얼마에 거래됐는지 정리해 드려요.</span></span><span class="tpl-chevron" aria-hidden="true"><i data-glyph="chevron-right" data-size="16" data-weight="semibold"></i></span></button></li>
