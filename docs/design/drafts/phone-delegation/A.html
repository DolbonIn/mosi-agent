  relative path), synthetic fixture data (docs/design/impeccable/capture.mjs), no network. ?theme=light|dark.
  Glyphs are inlined from apps/mobile/src/ui/Icon.tsx. Rationale: notes.md in this folder.

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모시 draft: phone-delegation · A</title>

<style>
:root { --accent-fill: #0071e3; }
.kit-phone { font-family: var(--font-text); }
/* the app's composer placeholder is --label-2 (chat.css .composer-field::placeholder); the kit's --label-3 is 1.9:1 */
.k-composer-field:not([data-filled]) { color: var(--label-2); }

/* scroller: content runs under the floating chrome and thins out at both edges (app/Screen.css .screen-scroll) */
.d-scroll {
  --edge-top: calc(var(--chrome-top) + var(--topbar-h));
  --edge-bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 10px + 56px);
  position: absolute; z-index: 1; inset: 0; overflow: hidden;
  padding: calc(var(--edge-top) + 12px) var(--gutter) 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--edge-top) - 4px), #000 calc(var(--edge-top) + 12px), #000 calc(100% - var(--edge-bottom) - 12px), transparent calc(100% - var(--edge-bottom) + 8px));
  mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--edge-top) - 4px), #000 calc(var(--edge-top) + 12px), #000 calc(100% - var(--edge-bottom) - 12px), transparent calc(100% - var(--edge-bottom) + 8px));
}
/* threads are bottom-anchored like the real list: the newest line rests just above the composer */
.d-thread { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(var(--edge-bottom) + 24px - var(--peek, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* user bubble: neutral 8 % ink, 20 px with the 8 px tail on the speaker's side (DESIGN Shapes) */
.d-me { align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: var(--r-group) var(--r-group) 8px var(--r-group); background: color-mix(in srgb, var(--label) 8%, var(--surface)); color: var(--label); font-size: var(--t-body); line-height: 1.5; overflow-wrap: anywhere; }

/* paper: flat. Light separates by value (#fff on #f5f5f7), dark by a hairline (DESIGN Flat Paper) */
.d-paper { background: var(--surface); color: var(--label); }
:root[data-theme="dark"] .d-paper { box-shadow: inset 0 0 0 1px var(--separator); }

/* assistant reply as paper (variant A): the tail corner is back (critique chat P2-1) and the radius is the card's */
.d-asst { align-self: flex-start; max-width: 100%; padding: 12px 16px; border-radius: 8px var(--r-card) var(--r-card) var(--r-card); font-size: var(--t-body); line-height: 1.55; }
/* assistant reply as plain text on the page (variant B, DESIGN "plain text for conversation") */
.d-say { font-size: var(--t-body); line-height: 1.55; color: var(--label); padding: 0 4px; }
.d-turn { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.d-turn-head { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin: -8px 0 -6px; padding: 0 4px; align-self: flex-start; font-size: var(--t-subhead); color: var(--label-2); }
.d-turn-head .avatar { flex: none; }

/* folded tool steps "N단계 · 1분 33초 ⌄" (chat.css .tools-pill) */
.d-steps { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: -6px 0; padding: 0 10px 0 8px; font-size: var(--t-subhead); color: var(--label-2); }

/* one chat card = one paper object; inside it only rows, hairlines and text (no tiles, no recessed panels) */
.d-card { display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 16px; border-radius: var(--r-card); word-break: keep-all; }
.d-title { font-family: var(--font-text); font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; text-wrap: balance; }
.d-sub { font-size: var(--t-subhead); line-height: 1.5; color: var(--label); }
.d-foot { font-size: var(--t-footnote); line-height: 1.45; color: var(--label-2); }
.d-hair { height: 0; border-top: 0.5px solid var(--separator); }
.d-glyph { flex: none; color: var(--label-2); }
.nowrap { white-space: nowrap; }

/* buttons: capsules (height / 2); one blue per screen = --accent-fill; everything else neutral */
.d-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; color: var(--label); }
.d-btn-lg { min-height: 52px; }
.d-btn-primary { background: var(--accent-fill); color: var(--on-accent); }
.d-btn-neutral { background: var(--fill); color: var(--label); }
.d-btn-plain { background: none; color: var(--label); }
.d-btn-block { display: flex; width: 100%; }

/* receipt: status pill with icon + words (kept: CH-4), label colour for AA */
.d-receipt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.d-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--fill); font-size: var(--t-subhead); font-weight: 600; color: var(--label); }

/* new-below dot on the current tab (variant B of chat): tapping the current tab jumps to the latest, iOS-style */

/* event notes: plain centred footnote text on the page, no pill (GT-1, CH-3) */
.d-note { align-self: center; max-width: 92%; text-align: center; font-size: var(--t-footnote); line-height: 1.45; color: var(--label-2); text-wrap: balance; }
.d-note + .d-note { margin-top: -6px; }

/* ── phone-delegation A ── */
.ph-head { display: flex; align-items: flex-start; gap: 8px; }
.ph-head > svg { margin-top: 3px; }
.ph-num { margin-top: -6px; font-size: var(--t-body); line-height: 1.4; color: var(--label); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ph-script { padding-left: 12px; font-size: var(--t-callout); line-height: 1.55; color: var(--label); text-indent: -0.42em; }
.ph-oneway { margin-top: -4px; }
.ph-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
/* B */
.phb-num { font-family: var(--font-display); font-size: var(--t-title2); font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
.phb-voice { display: flex; gap: 10px; align-items: flex-start; }
.phb-voice .avatar { flex: none; margin-top: 2px; }
.phb-voice p { font-size: var(--t-callout); line-height: 1.55; color: var(--label); }
.phb-hint { text-align: center; margin-top: -2px; }
/* schedule card above (context): clock inline in the meta, toggle on */
.sched { display: flex; align-items: center; gap: 12px; }
.sched-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sched-when { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-footnote); color: var(--label-2); }
.tgl { flex: none; position: relative; width: 51px; height: 31px; border-radius: 999px; background: var(--accent); }
.tgl::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgb(0 0 0 / 0.15), 0 1px 1px rgb(0 0 0 / 0.08); }

</style>
</head>
