  relative path), synthetic fixture data (docs/design/impeccable/capture.mjs), no network. ?theme=light|dark.
  Glyphs are inlined from apps/mobile/src/ui/Icon.tsx. Rationale: notes.md in this folder.

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root { --accent-fill: #0071e3; }
.kit-phone { font-family: var(--font-text); }
/* the app's composer placeholder is --label-2 (chat.css .composer-field::placeholder); the kit's --label-3 is 1.9:1 */
.k-composer-field:not([data-filled]) { color: var(--label-2); }

/* scroller: content runs under the floating chrome and thins out at both edges (app/Screen.css .screen-scroll) */
.d-scroll {
  --edge-top: calc(var(--chrome-top) + var(--topbar-h));
  --edge-bottom: calc(var(--tabbar-bottom) + var(--tabbar-h) + 10px + 56px);
  position: absolute; z-index: 1; inset: 0; overflow: hidden;
  padding: calc(var(--edge-top) + 12px) var(--gutter) 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--edge-top) - 4px), #000 calc(var(--edge-top) + 12px), #000 calc(100% - var(--edge-bottom) - 12px), transparent calc(100% - var(--edge-bottom) + 8px));
  mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--edge-top) - 4px), #000 calc(var(--edge-top) + 12px), #000 calc(100% - var(--edge-bottom) - 12px), transparent calc(100% - var(--edge-bottom) + 8px));
}
/* threads are bottom-anchored like the real list: the newest line rests just above the composer */
.d-thread { position: absolute; left: var(--gutter); right: var(--gutter); bottom: calc(var(--edge-bottom) + 24px - var(--peek, 0px)); display: flex; flex-direction: column; gap: 12px; }

/* user bubble: neutral 8 % ink, 20 px with the 8 px tail on the speaker's side (DESIGN Shapes) */
.d-me { align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: var(--r-group) var(--r-group) 8px var(--r-group); background: color-mix(in srgb, var(--label) 8%, var(--surface)); color: var(--label); font-size: var(--t-body); line-height: 1.5; overflow-wrap: anywhere; }

/* paper: flat. Light separates by value (#fff on #f5f5f7), dark by a hairline (DESIGN Flat Paper) */
.d-paper { background: var(--surface); color: var(--label); }
:root[data-theme="dark"] .d-paper { box-shadow: inset 0 0 0 1px var(--separator); }

/* assistant reply as paper (variant A): the tail corner is back (critique chat P2-1) and the radius is the card's */
.d-asst { align-self: flex-start; max-width: 100%; padding: 12px 16px; border-radius: 8px var(--r-card) var(--r-card) var(--r-card); font-size: var(--t-body); line-height: 1.55; }
/* assistant reply as plain text on the page (variant B, DESIGN "plain text for conversation") */
.d-say { font-size: var(--t-body); line-height: 1.55; color: var(--label); padding: 0 4px; }
.d-turn { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.d-turn-head { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin: -8px 0 -6px; padding: 0 4px; align-self: flex-start; font-size: var(--t-subhead); color: var(--label-2); }
.d-turn-head .avatar { flex: none; }

/* folded tool steps "N단계 · 1분 33초 ⌄" (chat.css .tools-pill) */
.d-steps { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: -6px 0; padding: 0 10px 0 8px; font-size: var(--t-subhead); color: var(--label-2); }

/* one chat card = one paper object; inside it only rows, hairlines and text (no tiles, no recessed panels) */
.d-card { display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 16px; border-radius: var(--r-card); word-break: keep-all; }
.d-title { font-family: var(--font-text); font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; text-wrap: balance; }
.d-sub { font-size: var(--t-subhead); line-height: 1.5; color: var(--label); }
.d-foot { font-size: var(--t-footnote); line-height: 1.45; color: var(--label-2); }
.d-hair { height: 0; border-top: 0.5px solid var(--separator); }
.d-glyph { flex: none; color: var(--label-2); }
.nowrap { white-space: nowrap; }

/* buttons: capsules (height / 2); one blue per screen = --accent-fill; everything else neutral */
.d-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: var(--t-body); font-weight: 600; letter-spacing: -0.01em; color: var(--label); }
.d-btn-lg { min-height: 52px; }
.d-btn-primary { background: var(--accent-fill); color: var(--on-accent); }
.d-btn-neutral { background: var(--fill); color: var(--label); }
.d-btn-plain { background: none; color: var(--label); }
.d-btn-block { display: flex; width: 100%; }

/* receipt: status pill with icon + words (kept: CH-4), label colour for AA */
.d-receipt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.d-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--fill); font-size: var(--t-subhead); font-weight: 600; color: var(--label); }

/* new-below dot on the current tab (variant B of chat): tapping the current tab jumps to the latest, iOS-style */

/* event notes: plain centred footnote text on the page, no pill (GT-1, CH-3) */
.d-note { align-self: center; max-width: 92%; text-align: center; font-size: var(--t-footnote); line-height: 1.45; color: var(--label-2); text-wrap: balance; }
.d-note + .d-note { margin-top: -6px; }

/* ── drawer A ── */
.kit-phone > .wallpaper { display: none; }
.kit-phone { background: var(--surface-2); }
.dr { position: absolute; inset: 0 auto 0 0; width: 320px; z-index: 1; display: flex; flex-direction: column; gap: 14px;
  padding: calc(var(--chrome-top) + 4px) 12px calc(var(--safe-bottom) + 16px); background: var(--surface-2); color: var(--label); }
/* the main card, pushed right, .96 and dimmed (Drawer.tsx §8.10) */
.dr-card { position: absolute; z-index: 2; top: 17px; left: 318px; width: 374px; height: 810px; border-radius: 48px; overflow: hidden; background: var(--bg); }
.dr-card .k-circle { position: absolute; top: 50px; left: 12px; }
.dr-card-body { position: absolute; top: 112px; left: 16px; width: 342px; display: flex; flex-direction: column; gap: 12px; }
.dr-card-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.2); }
html[data-theme="dark"] .dr-card-scrim { background: rgb(0 0 0 / 0.45); }
/* head (A): avatar + name, centred; the "나만의 AI 에이전트" line is gone */
.dr-head { display: flex; align-items: center; gap: 12px; padding: 4px 8px 6px; }
.dr-name { font-family: var(--font-display); font-size: var(--t-title3); font-weight: 700; letter-spacing: -0.015em; }
.dr-search { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 22px; background: var(--fill); color: var(--label); font-size: var(--t-callout); }
.dr-search svg { color: var(--label-2); flex: none; }
.dr-search[data-live] { background: var(--surface); }
html[data-theme="dark"] .dr-search[data-live] { box-shadow: inset 0 0 0 0.5px var(--separator); }
.dr-search-q { flex: 1 1 auto; min-width: 0; letter-spacing: 0.04em; }
.dr-search-q[data-empty] { color: var(--label-2); letter-spacing: 0; }
/* idle, it is a button on a fill, so its words are --label (label-2 on --fill is 4.0:1, drawer.css:21) */
.dr-search:not([data-live]) .dr-search-q[data-empty] { color: var(--label); }
.dr-caret { display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: var(--accent); border-radius: 1px; }
.dr-clear { flex: none; width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; background: var(--label-3); color: var(--surface); }
.dr-spot { display: flex; align-items: center; gap: 4px; }
.dr-spot > :first-child { flex: 1 1 auto; min-width: 0; }
.dr-cancel { flex: none; min-height: 44px; padding: 0 8px; font-size: var(--t-callout); color: var(--label); }
.dr-nav { display: flex; flex-direction: column; gap: 2px; }
.dr-item { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: var(--r-field); font-size: var(--t-body); color: var(--label); }
.dr-item > svg { color: var(--label-2); flex: none; }
.dr-item[data-on] { background: var(--fill); font-weight: 600; }
.dr-item[data-on] > svg { color: var(--label); }
.dr-sec { display: flex; flex-direction: column; gap: 2px; }
.dr-sec-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding-left: 12px; }
.dr-h { font-size: var(--t-footnote); font-weight: 600; color: var(--label-2); }
.dr-textbtn { min-height: 44px; padding: 0 12px; font-size: var(--t-footnote); font-weight: 600; color: var(--label-2); }
.dr-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
/* time sits on the title line only; the subtitle runs the full width under both (no early wrap) */
.dr-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; column-gap: 12px; align-items: start; min-height: 56px; padding: 9px 10px 9px 12px; border-radius: var(--r-field); color: var(--label); }
.dr-row .dr-row-body { display: contents; }
.dr-row > .dr-row-glyph { grid-column: 1; grid-row: 1 / span 2; }
.dr-row-title { grid-column: 2; grid-row: 1; }
.dr-row-time { grid-column: 3; grid-row: 1; }
.dr-row-sub { grid-column: 2 / 4; grid-row: 2; }
.dr-row-chev { grid-column: 3; grid-row: 1 / span 2; }
.dr-row[data-chev] .dr-row-sub { grid-column: 2; }
.dr-row[data-on] { background: var(--fill); }
.dr-row-glyph { display: grid; place-items: center; height: 20px; color: var(--label-2); }
.dr-row-body { display: flex; flex-direction: column; min-width: 0; }
.dr-row-title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--t-subhead); font-weight: 600; line-height: 1.35; }
.dr-row-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-unread { flex: none; width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
.dr-row-sub { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--t-footnote); line-height: 1.35; color: var(--label-2); }
.dr-row-sub span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
/* A only (B's "지금 하는 일" section says it): a quiet --fill pill with --label words, no glyph (the row glyph already names the kind) */
.dr-badge { flex: none; display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 9px; background: var(--fill); color: var(--label); font-weight: 600; }
.dr-row-time { font-size: var(--t-footnote); line-height: 1.35; color: var(--label-2); margin-top: 1px; }
/* search hits on a phone: no slab, no fill (coarse pointer has no cursor); the match carries the signal.
   A: --accent-text 700 on the --surface panel (4.7:1 light). B: on the drawer paper accent would be 4.2:1, so the
   title goes regular and the match --label 700, the way iOS Spotlight bolds what you typed. */
.dr-row mark { background: none; color: var(--accent-text); font-weight: 700; }
.dr-hits .dr-row-title { font-weight: 400; }
.dr-hits .dr-row mark { color: var(--label); }
.dr-row-chev { align-self: center; color: var(--label-3); }
.dr-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin-top: auto; padding-top: 12px; box-shadow: 0 -0.5px 0 var(--separator); }
.dr-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: var(--r-field); color: var(--label-2); font-size: var(--t-footnote); }
/* A: search results / recents on the paper under the field, flat */
.dr-panel { border-radius: var(--r-card); background: var(--surface); padding: 6px; }
html[data-theme="dark"] .dr-panel { box-shadow: inset 0 0 0 0.5px var(--separator); }
.dr-panel .dr-sec-head { min-height: 32px; }
/* B: the subtitle is a sentence; two lines like a message preview */
.dr[data-v="B"] .dr-row-sub { align-items: flex-start; }
.dr[data-v="B"] .dr-row-sub span:last-child { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dr[data-v="B"] .dr-badge { margin-top: 0; }
.dr-none { padding: 8px 12px; font-size: var(--t-footnote); color: var(--label-2); }

</style>
</head>
