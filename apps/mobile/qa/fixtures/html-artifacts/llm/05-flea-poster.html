<style>
*{box-sizing:border-box;margin:0;padding:0}
.poster{background:var(--surface);border-radius:var(--radius);padding:22px 18px;text-align:center}
.kicker{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
h2{font-size:29px;line-height:1.25;font-weight:800;margin:8px 0 6px;text-wrap:balance}
.lead{font-size:15px;color:var(--text-2);line-height:1.6}
.when{margin:16px 0 14px;padding:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.when .date{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.when .time{font-size:14px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}
.place{font-size:16px;font-weight:600}
.place span{display:block;font-size:14px;font-weight:400;color:var(--text-2);margin-top:2px}
ul{list-style:none;margin:16px 0 0;text-align:left}
li{display:flex;gap:8px;font-size:14px;line-height:1.55;padding:6px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li b{font-weight:600;color:var(--accent);min-width:52px;flex:0 0 auto}
p{word-break:keep-all}
</style>
<div class="poster">
  <p class="kicker">동네 사람들과 함께하는</p>
  <h2>가을 플리마켓</h2>
  <p class="lead">안 쓰는 물건도, 손으로 만든 물건도<br>이웃과 나누는 하루</p>

  <div class="when">
    <p class="date">11월 22일 토요일</p>
    <p class="time">오전 11시 – 오후 5시</p>
  </div>

  <p class="place">동네 공원 광장<span>비 오면 마을회관으로 옮겨요</span></p>

  <ul>
    <li><b>물품</b>중고 의류·책·그릇, 수공예 소품</li>
    <li><b>먹거리</b>핸드드립 커피, 수제 쿠키</li>
  </ul>
</div>
<p style="font-size:14px;color:var(--text-2);margin-top:12px;line-height:1.6">날짜·장소·판매 품목은 예시로 넣어 두었어요. 실제 정보 알려주시면 그대로 다듬어 드릴게요.</p>
